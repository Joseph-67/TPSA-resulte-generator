{% extends "base.html" %}
{% block content %}
<h1>Students</h1>
<form class="card form-row" method="post">
  <input name="name" placeholder="Student name" required>
  <input name="admission_no" placeholder="Admission number" required>
  <select name="sex"><option>Unknown</option><option>Male</option><option>Female</option></select>
  <select name="class_id" required>{% for item in classes %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select>
  <button type="submit">Add Student</button>
</form>
<div class="table-wrap">
  <table><thead><tr><th>Name</th><th>Admission No</th><th>Class</th><th>Sex</th></tr></thead>
  <tbody>{% for student in students %}<tr><td>{{ student.name }}</td><td>{{ student.admission_no }}</td><td>{{ student.class_name }}</td><td>{{ student.sex }}</td></tr>{% endfor %}</tbody></table>
</div>
{% endblock %}
