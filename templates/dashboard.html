{% extends "base.html" %}
{% block content %}
<h1>Dashboard</h1>
<div class="cards">
  <div class="card"><strong>{{ counts.students }}</strong>Active Students</div>
  <div class="card"><strong>{{ counts.classes }}</strong>Active Classes</div>
  <div class="card"><strong>{{ counts.subjects }}</strong>Active Subjects</div>
  <div class="card"><strong>{{ counts.results }}</strong>Result Records</div>
</div>
<section class="card" style="margin-top:1rem">
  <h2>Generate 3-Term Workbook</h2>
  <form class="toolbar" method="post" action="/generate">
    <select name="class_name" required>
      {% for class_name in classes %}<option value="{{ class_name }}">{{ class_name }}</option>{% endfor %}
    </select>
    <button type="submit">Download Workbook</button>
  </form>
</section>
{% endblock %}
