{% extends "base.html" %}
{% block content %}
<h1>Assign Subjects to Classes</h1>
<form class="card form-row" method="post">
  <input type="hidden" name="action" value="assign">
  <label>Class
    <select name="class_id" required>{% for item in classes %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select>
  </label>
  <label>Subject
    <select name="subject_id" required>{% for item in catalogue %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select>
  </label>
  <button type="submit">Assign Subject</button>
</form>
<div class="table-wrap">
  <table>
    <thead><tr><th>Class</th><th>Subject</th><th>Status</th><th>Action</th></tr></thead>
    <tbody>{% for item in assignments %}
      <tr>
        <td>{{ item.class_name }}</td><td>{{ item.name }}</td>
        <td>{{ "Active" if item.active else "Inactive" }}</td>
        <td><form method="post"><input type="hidden" name="assignment_id" value="{{ item.id }}"><button name="action" value="toggle" type="submit">{{ "Unassign" if item.active else "Restore" }}</button></form></td>
      </tr>
    {% endfor %}</tbody>
  </table>
</div>
{% endblock %}
