{% extends "base.html" %}
{% block content %}
<h1>Manage Classes</h1>
<form class="card form-row" method="post">
  <input name="name" placeholder="Class name" required>
  <input name="section" placeholder="Section" value="General">
  <button type="submit">Add Class</button>
</form>
<div class="table-wrap">
  <table>
    <thead><tr><th>Class</th><th>Section</th><th>Active Students</th><th>Status</th><th>Action</th></tr></thead>
    <tbody>{% for item in classes %}
      <tr>
        <td>{{ item.name }}</td><td>{{ item.section }}</td><td>{{ item.student_count }}</td>
        <td>{{ "Active" if item.active else "Inactive" }}</td>
        <td><form method="post"><input type="hidden" name="class_id" value="{{ item.id }}"><button name="action" value="toggle" type="submit">{{ "Deactivate" if item.active else "Reactivate" }}</button></form></td>
      </tr>
    {% endfor %}</tbody>
  </table>
</div>
{% endblock %}
